name: Test simulator

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.8"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check backend
      - run: uv run pytest

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: auction
          POSTGRES_DB: auction_test
          # Disposable CI database only; not a deployment credential.
          POSTGRES_PASSWORD: ci-only-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U auction -d auction_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      AUCTION_TEST_DATABASE_URL: postgresql+psycopg://auction:ci-only-test-password@127.0.0.1:5432/auction_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.8"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest backend/tests/test_postgres.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
