# Standalone alternative to compose.yaml; use `docker compose -f compose.postgres.yaml ...`.
services:
  simulator:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      AUCTION_DATABASE_URL: postgresql+psycopg://auction:${POSTGRES_PASSWORD:?Set a URL-safe POSTGRES_PASSWORD in .env}@postgres:5432/auction
      AUCTION_FRONTEND_DIR: /app/frontend/dist
      AUCTION_COOKIE_SECURE: ${AUCTION_COOKIE_SECURE:-false}
      AUCTION_ALLOWED_ORIGINS: ${AUCTION_ALLOWED_ORIGINS:-http://127.0.0.1:8000,http://localhost:8000}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: auction
      POSTGRES_DB: auction
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a URL-safe POSTGRES_PASSWORD in .env}
    volumes:
      # PostgreSQL 18+ uses a version-specific PGDATA beneath this mount.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auction -d auction"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  postgres-data:
