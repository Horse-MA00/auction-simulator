# Render Blueprint: one combined frontend/API service and private PostgreSQL.
# Paid entry tiers: about US$7 + US$6/month before additional usage/storage.
# Review Render's quoted charges before deploying; this file does not create services itself.
services:
  - type: web
    name: han2601-auction
    runtime: docker
    repo: https://github.com/Horse-MA00/auction-simulator.git
    branch: auction-simulator-v0
    region: singapore
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "8000"
      - key: AUCTION_FRONTEND_DIR
        value: /app/frontend/dist
      - key: AUCTION_COOKIE_SECURE
        value: "true"
      # The app reads Render's own RENDER_EXTERNAL_URL at runtime.
      # Set AUCTION_ALLOWED_ORIGINS separately only for additional custom domains.
      - key: AUCTION_DATABASE_URL
        fromDatabase:
          name: han2601-postgres
          property: connectionString

databases:
  - name: han2601-postgres
    databaseName: auction
    user: auction
    region: singapore
    plan: 0.1c-256mb
    # Only Render's private network can access the database.
    ipAllowList: []
